<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explicación de HTML Atributos II</title>
</head>
<body>
    <!-- <elemento atributo="valor"></elemento> -->
    <a href="https://criptoradar.basilicontech.com/" target="_blank">Visita Criptordar</a>
    <a href="https://basilicontech.com/" target="_blank">Visita Basilicontech</a>

    <img src="../imagenes/cats.jpg" alt="Dos gatitos atigrados durmiendo juntos en un sofá." />

    <!-- Un ejemplo del atributo checked en un elemento de entrada de tipo checkbox. El atributo checked indica 
    que la casilla de verificación está marcada por defecto cuando se carga la página web. -->
    <input type="checkbox" checked />

    <br>

    <!-- un ejemplo sin el checked, lo que significa que la casilla de verificación estará desmarcada por defecto 
    cuando se cargue la página web. -->
    <input type="checkbox" />

    <br>

    <!-- Un ejemplo del atributo disabled en un elemento de entrada de tipo texto sin el atributo disabled -->
    <input type="text">

    <br>
    <!-- un ejemplo del atributo disabled en un elemento de entrada de tipo texto con el atributo disabled, lo que significa que el campo de texto estará deshabilitado y no se podrá interactuar con él. -->
    <input type="text" disabled>

</body>
</html>
