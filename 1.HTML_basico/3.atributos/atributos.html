<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explicación de HTML</title>
</head>
<body>

    <!-- Hay un solo encabezado principal -->
    <h1>Elemento de encabezado principal</h1>

    <!-- Hay varios elementos de párrafo -->
    <p>Soy un elemento de párrafo.</p>
    
    <p></p>

    <!-- Hay varias formas de escribir un elemento vacio, como la etiqueta de imagen, que no tiene contenido y se cierra a sí misma: -->
    <img>

    <img />

    <!-- ejemplos de atributos de imagen  -->
    <!-- atributo src: especifica la ruta de la imagen que se mostrará en la página web. -->
    <img src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/cats.jpg"/>
    <!-- combinacion de atributos src y alt: el atributo alt proporciona un texto alternativo que se mostrará si la imagen no se puede cargar. -->
    <img src="https://cdn.freecodamp.org/curriculum/cat-photo-app/cats.jpg" alt="Dos gatitos atigrados durmiendo juntos en un sofá."/>

</body>
</html>
