<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SilverCompany</title>
</head>
<body>

    <!-- 
    *************************************************************
                    Enunciado del ejercicio:
    *************************************************************
    Depura la página de perfil de SilverCompany
    SilverCompany está intentando crear una página de perfil. 
    Le pidió a un amigo que revisara su código y este le indicó que contenía algunos errores.

    Tu tarea consiste en corregir todos los errores de SilverCompany para que pueda continuar con la creación de su página de perfil.  -->

    <!-- 
    *************************************************************
                    Historias de usuario:
    *************************************************************
    - SilverCompany intenta utilizar un elemento `heading2`, pero dicho elemento no existe. Corrige las etiquetas para que 
    utilicen un elemento de encabezado de segundo nivel válido.
    - SilverCompany intenta añadir dos párrafos usando `pp`, pero estas etiquetas tampoco existen. 
    Modifícalas para utilizar las etiquetas de párrafo correctas.
    - SilverCompany utiliza un elemento `h3` para el subencabezado "Antecedentes e intereses" 
    pero presenta un error de sintaxis. Identifica el problema y soluciónalo. -->

    <!-- 
    *************************************************************
                    Pistas:
    *************************************************************
    1. Debes tener exactamente un elemento h1 en la página.
    2. No debes eliminar el elemento <h1>¡Hola, soy SilverCompany!</h1> de la página.
    3. Debes tener exactamente un elemento h2 en la página.
    4. Debes tener un elemento h2 con el texto "Sobre mí". Aquí tienes un ejemplo: <h2>Texto aquí</h2>
    5. Debes tener un elemento de párrafo con el texto "Me llamo SilverCompany y me encanta aprender cosas nuevas.". 
    Aquí tienes un ejemplo: <p>Texto aquí</p>
    6. Debes tener un elemento de párrafo con el texto "Disfruto resolviendo acertijos.". 
    Aquí tienes un ejemplo: <p>Texto aquí</p>
    7. Debes tener exactamente dos elementos de párrafo en la página.
    8. Debes tener exactamente un elemento h3 en la página.
    9. Debes tener un elemento h3 con el texto "Antecedentes e intereses". Aquí tienes un ejemplo: <h3>Texto aquí</h3>
    10. Debes tener exactamente cinco elementos en total en la página. -->

<h1>¡Hola, soy SilverCompany!</h1>

<heading2>Sobre mí</heading2>

<pp>Me llamo SilverCompany y me encanta aprender cosas nuevas.</pp>

<h3>Antecedentes e intereses<h3/>
<pp>Disfruto resolviendo acertijos.</pp>



</body>
</html>
