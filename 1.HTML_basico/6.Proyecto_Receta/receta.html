<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
    Debes incluir una declaración `!DOCTYPE html`.
    Debes tener un elemento `html` con el atributo `lang` establecido en `es`.
    Debes incluir un elemento `head` que contenga un elemento `title` con el nombre de tu receta, 
    además de un elemento `meta` con el atributo `charset` configurado como `UTF-8`.
    Debes incluir un elemento `body`.
    Debes tener un único elemento `h1` que contenga el nombre de tu receta.
    Debes incluir un elemento `p` debajo del `h1` que sirva como introducción a la receta.
    Debes tener un elemento `h2` con el texto «Ingredientes» (Ingredientes) para la sección de ingredientes.
    Debes incluir una lista desordenada (elemento `ul`) con al menos cuatro elementos de lista (`li`) que enumeren 
    los ingredientes, situada debajo del primer elemento `h2`.
    Debes tener un segundo elemento `h2` con el texto «Instrucciones» (Instrucciones) para la sección de instrucciones.
    Debes incluir una lista ordenada (elemento `ol`) con al menos cuatro elementos de lista que detallen los pasos de la receta en orden, situada debajo del segundo elemento `h2`.
    Debes incluir un elemento `img` con un atributo `src` que apunte a una imagen válida y un atributo `alt` que describa dicha imagen. 
    Si lo deseas, puedes utilizar: recipe.jpg. 
    -->
</body>
</html>
