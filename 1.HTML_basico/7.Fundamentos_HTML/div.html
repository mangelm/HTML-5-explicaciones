<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de Div</title>
</head>
<body>
    <!-- 
        Se utiliza el elemento div para agrupar contenido y 
        estilos a un conjunto de elementos no tiene significado semántico por sí mismo.
    -->
    <div>
        <p>Ejemplo de elemento de párrafo.</p>
    </div>

    <!--
        Se utiliza el elemento section para agrupar contenido relacionado
        y darle un significado semántico a la sección.
    -->
    <section>
        <h2>Mamíferos</h2>
        <p>
            Los mamíferos son animales de sangre caliente que tienen pelaje o pelo. La mayoría da a luz a crías vivas. 
        </p>
        <ul>
            <li>León</li>
            <li>Elefante</li>
            <li>Delfín</li>
        </ul>
    </section>
</body>
</html>
