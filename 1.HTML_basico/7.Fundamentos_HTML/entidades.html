<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplos Comunes entidades HTML</title>
</head>
<body>

    <!-- referencia por caracteres de nombre -->
    <p>Esto es un elemento &lt;img /&gt; </p>

    <!-- referencia númerica decimal -->
    <p>Esto es un elemento &#60;img &#47;&#62; </p>

    <!-- referencia númerica hexadecimal -->
    <p>Esto es un elemento &#x3C;img &#x2F;&#x3E; </p>
</body>
</html>
